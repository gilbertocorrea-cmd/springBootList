<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" lang="pt-br">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Novo Produto</title>
    <!-- Carrego o CSS do Bootstrap pela CDN para aplicar o visual dos cards, botões, formulários e alertas.
         Com integrity, peço ao navegador que confira o conteúdo recebido; com crossorigin, uso a requisição sem credenciais. -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Carrego a biblioteca dos ícones usados nas ações e mensagens.
         Preciso revisar esta URL: ela contém uma quebra de linha dentro do nome do arquivo;
         o endereço deve terminar em /font/bootstrap-icons.min.css, sem quebra dentro do atributo. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-
icons.min.css">
</head>

<body>
    <!-- Centralizo o formulário e ajusto sua largura para telas médias e grandes com as classes do Bootstrap. -->
    <div class="container col-lg-6 col-md-8 my-5">
        <!-- Reúno o conteúdo em um card com sombra leve e sem borda visível. -->
        <div class="card shadow-sm border-0">
            <!-- Destaco o título da operação no cabeçalho do card: azul no cadastro e amarelo na edição. -->
            <div class="card-header bg-primary text-white py-3">
                <h2 class="h4 mb-0"><i class="bi bi-plus-square me-2"></i>Adicionar Novo Produto</h2>
            </div>
            <!-- Organizo a orientação e o formulário dentro do card com espaço interno para facilitar a leitura. -->
            <div class="card-body p-4">
                <p class="text-muted mb-4">Preencha as informações do novo item abaixo:</p>
                <!-- Vinculo o formulário ao DTO product recebido do controller usando th:object.
                     Com th:action, gero o destino /products/save; com POST, envio os valores para saveProduct.
                     Nos campos, uso *{...} para acessar componentes desse product por meio de th:field.
                     Deixo o Thymeleaf montar os nomes e valores dos campos, inclusive ao reapresentar erros de validação. -->
                <form action="#" th:action="@{/products/save}" th:object="${product}" method="post">
                    <!-- Substituo este bloco pelo fragmento chamado validacao, definido em validacao.html.
                         Reaproveito a mesma apresentação de erros no cadastro e na edição, dentro do formulário. -->
                    <div th:replace="~{validacao :: validacao}"></div>
                    <!-- Agrupo o rótulo e o campo correspondente, deixando espaço até o próximo campo. -->
                    <div class="mb-3">
                        <label class="form-label fw-bold" for="name">Nome do Produto:</label>
                        <input class="form-control" type="text" id="name" th:field="*{nome}"
                            placeholder="Ex: Notebook Gamer" />
                    </div>
                    <!-- Agrupo o rótulo e o campo correspondente, deixando espaço até o próximo campo. -->
                    <div class="mb-3">
                        <label class="form-label fw-bold" for="brand">Marca:</label>
                        <input class="form-control" type="text" id="brand" th:field="*{marca}" placeholder="Ex: Dell" />
                    </div>
                    <!-- Agrupo o rótulo e o campo correspondente, deixando espaço até o próximo campo. -->
                    <div class="mb-3">
                        <label class="form-label fw-bold" for="made-in">País de Fabricação:</label>
                        <input class="form-control" type="text" id="made-in" th:field="*{paisFabricacao}"
                            placeholder="Ex: Brasil" />
                    </div>
                    <!-- Separo a entrada do preço. Com step e min, ofereço controles de centavos e mínimo 0.01 no navegador.
                         Continuo dependendo da validação no back-end; esses atributos não substituem as regras do DTO. -->
                    <div class="mb-4">
                        <label class="form-label fw-bold" for="price">Preço (R$):</label>
                        <input type="number" step="0.01" min="0.01" class="form-control" id="price" th:field="*{preco}"
                            placeholder="0.00" />
                    </div>
                    <!-- Distribuo as ações nas extremidades: voltar ou cancelar de um lado, enviar o formulário do outro.
                         Ao voltar pela lista, saio sem enviar as alterações; ao clicar em submit, envio o POST. -->
                    <div class="d-flex justify-content-between">
                        <a href="/products" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left me-1"></i> Voltar à Lista
                        </a>
                        <button type="submit" class="btn btn-primary px-4">
                            <i class="bi bi-check2-circle me-1"></i> Salvar Produto
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <!-- Carrego o JavaScript do Bootstrap para ativar interações como fechar os alertas de validação.
         Uso o bundle, que também inclui Popper; não preciso escrever um script próprio para enviar este formulário.
         Com integrity, verifico o conteúdo do arquivo recebido antes de executá-lo. -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
