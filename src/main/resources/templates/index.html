<!DOCTYPE html>
<html lang="pt-br" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gerenciar Produtos</title>
    <!-- Carrego o CSS do Bootstrap pela CDN para aplicar o visual dos cards, botões, formulários e alertas.
         Com integrity, peço ao navegador que confira o conteúdo recebido; com crossorigin, uso a requisição sem credenciais. -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Carrego a biblioteca dos ícones usados nas ações e mensagens.
         Preciso revisar esta URL: ela contém uma quebra de linha dentro do nome do arquivo;
         o endereço deve terminar em /font/bootstrap-icons.min.css, sem quebra dentro do atributo. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-
icons.min.css">
</head>

<body>
    <!-- Agrupo a tela de listagem em uma área centralizada com espaçamento vertical. -->
    <div class="container my-4">
        <!-- Monto o painel de apresentação com título, descrição e acesso ao cadastro. -->
        <div class="container-fluid py-4 bg-light rounded-3 mb-4 shadow-sm">
            <h1 class="display-5 fw-bold text-primary">Lista de Produtos</h1>
            <p class="col-md-8 fs-5 text-muted">
                Painel administrativo para controle e gerenciamento de produtos para venda
            </p>
            <!-- Abro GET /products/new para receber o formulário de cadastro preparado pelo controller. -->
            <a class="btn btn-primary btn-lg" href="/products/new">
                <i class="bi bi-plus-circle me-1"></i> Criar Novo Produto
            </a>
        </div>
        <!-- Agrupo as mensagens e a tabela abaixo da apresentação, sem acrescentar espaçamento lateral. -->
        <div class="container-fluid px-0">
            <!-- Incluo o conteúdo de alert.html no lugar deste bloco usando th:replace.
                 Exibo as mensagens success ou fail disponíveis no Model, incluindo os atributos flash do controller. -->
            <div th:replace="~{alert}"></div>
            <!-- Reúno o conteúdo em um card com sombra leve e sem borda visível. -->
            <div class="card shadow-sm border-0">
                <!-- Deixo a tabela ocupar o corpo do card sem espaçamento interno adicional. -->
                <div class="card-body p-0">
                    <!-- Apresento os produtos com linhas alternadas e destaque ao passar o mouse.
                         Reservo uma linha para cada ficha recebida do controller. -->
                    <table class="table table-hover table-striped align-middle mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th scope="col" style="width: 10%;">ID</th>
                                <th scope="col" style="width: 30%;">Nome</th>
                                <th scope="col" style="width: 20%;">Marca</th>
                                <th scope="col" style="width: 20%;">País Fabricação</th>
                                <th scope="col" class="text-end" style="width: 10%;">Preço</th>
                                <th scope="col" class="text-center" style="width: 10%;">Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Mostro a mensagem de lista vazia somente quando não tenho produtos em listProducts.
                                 Ocupo as seis colunas com uma única mensagem, sem criar um produto fictício. -->
                            <tr th:if="${#lists.isEmpty(listProducts)}">
                                <td colspan="6" class="text-center py-4 text-muted">
                                    <i class="bi bi-inbox fs-2 d-block mb-2"></i>
                                    Nenhum produto cadastrado no momento.
                                </td>
                            </tr>
                            <!-- Percorro listProducts, que recebo de model.addAttribute("listProducts", products).
                                 Repito esta linha para cada ProductResponseDTO e uso product como nome do item atual.
                                 Com th:text, substituo os textos de exemplo pelos dados reais, escapando o HTML. -->
                            <tr th:each="product : ${listProducts}">
                                <td class="fw-bold" th:text="${product.id}">1</td>
                                <td th:text="${product.nome}">Nome do Produto</td>
                                <td th:text="${product.marca()}">Marca</td>
                                <td th:text="${product.paisFabricacao()}">País</td>
                                <!-- Exibo o preço com R$, ao menos um dígito inteiro, ponto para milhares e vírgula para duas casas decimais.
                                     Formato apenas a apresentação; não altero o preço armazenado no DTO ou no banco. -->
                                <td class="text-end fw-semibold" th:text="${'R$ ' +
#numbers.formatDecimal(product.preco, 1, 'POINT', 2, 'COMMA')}">R$ 0,00</td>
                                <td class="text-center">
                                    <!-- Monto o endereço de edição com o ID desta linha, por exemplo /products/edit/5.
                                         Com @{...}, deixo o Thymeleaf gerar a URL considerando o contexto da aplicação. -->
                                    <a class="btn btn-outline-primary btn-sm me-1" title="Editar Produto"
                                        th:href="@{'/products/edit/' + ${product.id}}" role="button">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                    <!-- Monto o endereço de exclusão com o ID desta linha.
                                         Com confirm(), abro a confirmação do navegador: OK permite seguir o link; Cancelar retorna false.
                                         Neste tutorial, sigo um link GET para excluir; o confirm não é uma proteção no servidor. -->
                                    <a class="btn btn-outline-danger btn-sm" title="Excluir Produto"
                                        th:href="@{'/products/delete/' + ${product.id}}" role="button"
                                        onclick="return confirm('Deseja realmente excluir este produto?');">
                                        <i class="bi bi-trash"></i>
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <!-- Ativo os comportamentos do Bootstrap com seu JavaScript; o bundle também inclui Popper.
         Uso este script, por exemplo, para fazer os botões data-bs-dismiss fecharem os alertas.
         Não envio produtos com este script: o formulário HTML e o controller cuidam disso. -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
