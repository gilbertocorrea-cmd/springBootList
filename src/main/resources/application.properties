# Identifico minha aplicação.
spring.application.name=springBootList

# Recebo a conexão pelo ambiente; não guardo credenciais no código.
# Preciso definir estas três variáveis no terminal, na IDE ou na hospedagem.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Por padrão, verifico as tabelas existentes sem alterar sua estrutura.
# No desenvolvimento, posso definir SPRING_JPA_HIBERNATE_DDL_AUTO=update explicitamente.
spring.jpa.hibernate.ddl-auto=validate

# Não imprimo o SQL no console por padrão.
spring.jpa.show-sql=false

# Reaproveito os templates em produção; posso desativar pelo ambiente no desenvolvimento.
spring.thymeleaf.cache=true

# Não devolvo detalhes internos dos erros nas respostas padrão do Spring Boot.
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
